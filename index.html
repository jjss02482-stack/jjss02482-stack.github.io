<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>俯视像素瘸帮成员</title>
<style>
  body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
  #game {
    position: relative;
    width: 400px;
    height: 400px;
    background-image: url('https://i.imgur.com/9s6YcGZ.png'); /* 曼哈顿俯视像素背景图（示例） */
    background-size: cover;
    border: 2px solid #333;
  }
  #player {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #ff0; /* 黄色瘸帮成员像素 */
    top: 190px;
    left: 190px;
    border:1px solid #000;
  }
</style>
</head>
<body>
<div id="game">
  <div id="player"></div>
</div>

<script>
const player = document.getElementById('player');
const step = 10;

// 恢复上次位置
let posX = parseInt(localStorage.getItem('playerX')) || 190;
let posY = parseInt(localStorage.getItem('playerY')) || 190;
player.style.left = posX + 'px';
player.style.top = posY + 'px';

document.addEventListener('keydown', e => {
  switch(e.key){
    case 'ArrowUp':
    case 'w': posY = Math.max(0, posY - step); break;
    case 'ArrowDown':
    case 's': posY = Math.min(380, posY + step); break;
    case 'ArrowLeft':
    case 'a': posX = Math.max(0, posX - step); break;
    case 'ArrowRight':
    case 'd': posX = Math.min(380, posX + step); break;
  }
  player.style.left = posX + 'px';
  player.style.top = posY + 'px';
  localStorage.setItem('playerX', posX);
  localStorage.setItem('playerY', posY);
});
</script>
</body>
</html>
