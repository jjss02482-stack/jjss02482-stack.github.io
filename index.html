<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人档案</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;700&family=Noto+Sans+SC:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #000; --text: #fff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Noto Sans SC', sans-serif; margin: 0; }

        /* 顶部黑白人型拼接 */
        .header-split { display: flex; height: 500px; width: 100%; border-bottom: 1px solid #222; }
        .side-white { 
            width: 50%; background: #fff; position: relative; 
            display: flex; justify-content: flex-end; align-items: flex-end;
        }
        .side-black { 
            width: 50%; background: #000; padding: 60px; 
            display: flex; flex-direction: column; justify-content: center;
        }
        
        /* 人型几何剪影 */
        .silhouette-black {
            width: 200px; height: 350px; background: #000;
            clip-path: polygon(50% 0%, 80% 10%, 90% 35%, 50% 45%, 10% 35%, 20% 10%);
            margin-right: -100px; z-index: 10;
        }
        .silhouette-white {
            width: 200px; height: 350px; background: #fff;
            clip-path: polygon(50% 0%, 80% 10%, 90% 35%, 50% 45%, 10% 35%, 20% 10%);
            margin-left: -100px;
        }

        /* 个人基本信息 */
        .name { font-family: 'Noto Serif SC', serif; font-size: 48px; font-weight: 700; margin: 0; letter-spacing: 2px; }
        .birth-info { font-size: 14px; color: #888; margin: 10px 0 30px; letter-spacing: 1px; }
        .timer { font-family: monospace; font-size: 18px; border-left: 2px solid #fff; padding-left: 15px; }

        /* 游戏与数据属性 */
        .main-content { display: grid; grid-template-columns: 1fr 1fr; padding: 80px; gap: 60px; }
        
        .game-section h3 { font-family: 'Noto Serif SC', serif; font-size: 24px; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .game-item { font-size: 16px; margin: 20px 0; color: #ccc; letter-spacing: 1px; }
        
        .radar-container { display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 400px !important; max-height: 400px !important; }

        /* 底部20格矩阵 */
        .matrix-footer { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; 
            padding: 60px 80px; border-top: 1px solid #222;
        }
        .matrix-cell { 
            aspect-ratio: 1; border: 1px solid #1a1a1a; display: flex; 
            align-items: center; justify-content: center; font-size: 11px; color: #333;
        }
        .matrix-cell.active { border-color: #fff; }
        .matrix-cell.active a { color: #fff; text-decoration: none; font-weight: 500; text-align: center; line-height: 1.4; }

    </style>
</head>
<body>

<section class="header-split">
    <div class="side-white">
        <div class="silhouette-black"></div>
    </div>
    <div class="side-black">
        <div class="silhouette-white" style="position: absolute; left: 0; top: 100px;"></div>
        <h1 class="name">COMMANDER</h1>
        <div class="birth-info">出生日期：2012年3月30日</div>
        <div id="live-timer" class="timer">计算中...</div>
    </div>
</section>

<section class="main-content">
    <div class="game-section">
        <h3>游戏档案</h3>
        <div class="game-item">■ 暗区突围 (Arena Breakout)</div>
        <div class="game-item">■ KARDS</div>
    </div>

    <div class="radar-container">
        <canvas id="statChart"></canvas>
    </div>
</section>

<div class="matrix-footer">
    <div class="matrix-cell">01</div><div class="matrix-cell">02</div><div class="matrix-cell">03</div><div class="matrix-cell">04</div>
    <div class="grid-item matrix-cell">05</div><div class="matrix-cell">06</div><div class="matrix-cell">07</div><div class="matrix-cell">08</div>
    
    <div class="matrix-cell active"><a href="#">GRIM<br>官网</a></div>
    <div class="matrix-cell active"><a href="#">GRIM<br>终端</a></div>
    
    <div class="matrix-cell">11</div><div class="matrix-cell">12</div><div class="matrix-cell">13</div><div class="matrix-cell">14</div>
    <div class="matrix-cell">15</div><div class="matrix-cell">16</div><div class="matrix-cell">17</div><div class="matrix-cell">18</div>
    <div class="matrix-cell">19</div><div class="matrix-cell">20</div>
</div>

<script>
    // 精确年龄计时器
    function updateTimer() {
        const birth = new Date('2012-03-30T00:00:00');
        const now = new Date();
        const diff = now - birth;
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        let years = now.getFullYear() - birth.getFullYear();
        if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) {
            years--;
        }

        document.getElementById('live-timer').innerHTML = 
            `已存续：${years}岁<br>总计：${days}天`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // 属性六边形图
    const ctx = document.getElementById('statChart').getContext('2d');
    new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['攻击力', '防御力', '智力', '体力', '经验', '技术'],
            datasets: [{
                data: [0, 1, 7, 3, 5, 7],
                backgroundColor: 'rgba(255, 255, 255, 0.1)',
                borderColor: '#ffffff',
                borderWidth: 1.5,
                pointRadius: 0
            }]
        },
        options: {
            scales: {
                r: {
                    angleLines: { color: '#222' },
                    grid: { color: '#222' },
                    pointLabels: { color: '#888', font: { size: 14 } },
                    ticks: { display: false },
                    min: 0, max: 8
                }
            },
            plugins: { legend: { display: false } }
        }
    });
</script>

</body>
</html>
