<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Blog | 0330</title>
    <style>
        :root {
            --accent-orange: #ff9800; /* 这里的橙色是给你的暗区突围情怀留的 */
            --senra-warm: #bda286;
            --main-text: #2d2d2d;
            --sub-text: #999;
            --bg: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--main-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 90%;
            padding: 80px 0;
        }

        /* 个人基本介绍 */
        header {
            margin-bottom: 60px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 20px 0;
            font-weight: 600;
        }

        .bio {
            font-size: 16px;
            line-height: 1.8;
            color: var(--main-text);
        }

        .info-tags {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tag {
            font-size: 13px;
            color: var(--sub-text);
            background: #f8f8f8;
            padding: 4px 12px;
            border-radius: 2px;
        }

        /* 游戏兴趣 */
        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sub-text);
            margin: 40px 0 20px 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .interest-item {
            margin-bottom: 25px;
        }

        .interest-item strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .interest-item p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        /* 导航跳转区 */
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 60px;
        }

        .nav-card {
            padding: 30px;
            text-decoration: none;
            border: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .nav-card.grim-link {
            border-left: 4px solid var(--accent-orange);
        }

        .nav-card.senra-link {
            border-left: 4px solid var(--senra-warm);
        }

        .nav-card:hover {
            background: #fafafa;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }

        .nav-card h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: var(--main-text);
        }

        .nav-card span {
            font-size: 12px;
            color: var(--sub-text);
        }

        footer {
            margin-top: 100px;
            font-size: 12px;
            color: #ccc;
            text-align: center;
        }

        @media (max-width: 500px) {
            .nav-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>你好，我是 0330</h1>
        <div class="bio">
            一个生活在上海的 10 后，白羊座，属龙。
            性格里有白羊的直爽，也有上海的细致。
            喜欢钻研军事，也享受在游戏世界里的博弈。
        </div>
        <div class="info-tags">
            <span class="tag">2012 / 03 / 30</span>
            <span class="tag">上海人</span>
            <span class="tag">汉族</span>
            <span class="tag">白羊座 · 龙</span>
        </div>
    </header>

    <div class="section-label">Gaming & Interests</div>
    
    <div class="interest-item">
        <strong>《暗区突围》 Arena Breakout</strong>
        <p>沉迷于那种撤离时的心跳感，比起无脑冲锋，我更喜欢研究战术和资源博弈。</p>
    </div>

    <div class="interest-item">
        <strong>《KARDS》</strong>
        <p>来自冰岛的二战题材卡牌游戏，在每一张卡牌的交替中感受历史与策略的张力。</p>
    </div>

    <div class="section-label">My Projects</div>

    <div class="nav-grid">
        <a href="./grim/index.html" class="nav-card grim-link">
            <h3>G.R.I.M.</h3>
            <span>战术网络系统</span>
        </a>
        <a href="./senra/index.html" class="nav-card senra-link">
            <h3>SENRA</h3>
            <span>Senra 品牌官网</span>
        </a>
    </div>

    <footer>
        &copy; 2026. 设计由心，代码随行。
    </footer>
</div>

</body>
</html>
