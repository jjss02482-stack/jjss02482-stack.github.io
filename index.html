<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纽约 2015 - 序章</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Microsoft YaHei', sans-serif; }

        /* 塔科夫风格背景：大厦轻微摇晃 + 呼吸感 */
        .background-container {
            position: fixed;
            width: 110%; height: 110%;
            left: -5%; top: -5%;
            background: url('https://r.jina.ai/i/0f3333333333333') no-repeat center center; /* 此处可换成你生成的本地大图路径 */
            background-size: cover;
            animation: cameraSway 15s infinite ease-in-out, lightningStrike 6s infinite;
            z-index: 1;
        }

        /* 蒙版：增加压抑感 */
        .overlay {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        /* 标题与按钮容器 */
        .ui-content {
            position: relative;
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh;
        }

        .title {
            font-size: 85px; color: #fff; font-weight: 900;
            letter-spacing: 20px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 5px;
            animation: flicker 4s infinite;
        }

        .subtitle {
            font-size: 18px; color: #888; letter-spacing: 10px; margin-bottom: 80px;
        }

        .start-btn {
            padding: 18px 80px; font-size: 20px; color: #fff;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer; letter-spacing: 8px;
            transition: 0.5s; backdrop-filter: blur(5px);
            text-decoration: none; /* 去掉超链接下划线 */
        }

        .start-btn:hover {
            background: #fff; color: #000;
            box-shadow: 0 0 40px rgba(255,255,255,0.6);
            transform: scale(1.05);
        }

        /* --- 动画：相机摇晃 --- */
        @keyframes cameraSway {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-10px, -15px) scale(1.02); }
        }

        /* --- 动画：随机闪电闪屏 --- */
        @keyframes lightningStrike {
            0%, 94%, 100% { filter: brightness(1) contrast(1); }
            95% { filter: brightness(3) contrast(1.2); }
            97% { filter: brightness(1.5); }
            98% { filter: brightness(4) white-balance(20); }
        }

        /* --- 动画：文字微闪 --- */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
            98% { opacity: 1; }
            99% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="ui-content">
        <div class="title">NEW YORK 2015</div>
        <div class="subtitle">曼哈顿禁区：生存协议</div>
        <a href="chat.html" class="start-btn">开始游戏</a>
    </div>

</body>
</html>
