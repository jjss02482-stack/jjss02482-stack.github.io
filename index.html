<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>像素移动人物 Demo</title>
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
  #game { position: relative; width: 400px; height: 400px; background: #555; }
  #player {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #0f0;
    top: 190px;
    left: 190px;
  }
</style>
</head>
<body>
<div id="game">
  <div id="player"></div>
</div>

<script>
const player = document.getElementById('player');
const step = 10; // 每次移动10像素

// 恢复上次位置
let posX = parseInt(localStorage.getItem('playerX')) || 190;
let posY = parseInt(localStorage.getItem('playerY')) || 190;
player.style.left = posX + 'px';
player.style.top = posY + 'px';

document.addEventListener('keydown', e => {
  switch(e.key){
    case 'ArrowUp':
    case 'w': posY = Math.max(0, posY - step); break;
    case 'ArrowDown':
    case 's': posY = Math.min(380, posY + step); break;
    case 'ArrowLeft':
    case 'a': posX = Math.max(0, posX - step); break;
    case 'ArrowRight':
    case 'd': posX = Math.min(380, posX + step); break;
  }
  player.style.left = posX + 'px';
  player.style.top = posY + 'px';
  localStorage.setItem('playerX', posX);
  localStorage.setItem('playerY', posY);
});
</script>
</body>
</html>
