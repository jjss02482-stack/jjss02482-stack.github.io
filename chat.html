<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.R.I.M. AI 战术终端</title>

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

<style>
:root {
    --grim-red:#ff0000;
    --grim-gray:#1a1a1a;
}

body{
    background:#000;
    color:#fff;
    font-family:Courier New;
    margin:0;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    padding:15px 25px;
    border-bottom:2px solid #1a1a1a;
    display:flex;
    justify-content:space-between;
    background:#0a0a0a;
}

#display{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.intel-entry{
    border-bottom:1px solid #111;
    margin-bottom:8px;
}

.meta{
    font-size:11px;
    color:#ff0000;
}

.terminal-input{
    padding:15px;
    background:#0a0a0a;
    border-top:2px solid #1a1a1a;
    display:flex;
    gap:6px;
}

input,button{
    background:#000;
    color:#fff;
    border:1px solid #333;
    padding:8px;
}

button{
    background:#ff0000;
    cursor:pointer;
}

.ai-panel{
    padding:15px;
    border-top:2px solid #1a1a1a;
    background:#050505;
}

#aiOutput{
    white-space:pre-wrap;
    color:#0f0;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
<div>G.R.I.M. Tactical + DeepSeek AI</div>
</header>

<div id="display"></div>

<form class="terminal-input" id="intel-form">
<input id="callsign" placeholder="呼号" required>
<input id="message" placeholder="战术情报">
<button>发送</button>
</form>

<div class="ai-panel">

<div>
<input id="apiKey" placeholder="DeepSeek API Key">
<button onclick="saveKey()">保存密钥</button>
</div>

<div style="margin-top:10px;">
<input id="aiInput" placeholder="请求 AI 战术分析">
<button onclick="askAI()">AI 分析</button>
</div>

<div id="aiOutput">AI 输出区域...</div>

</div>

<script>

/* ========= Gun 实时通讯 ========= */

const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
const network = gun.get('grim_ai_network');

const display = document.getElementById('display');

document.getElementById('intel-form').onsubmit=e=>{
e.preventDefault();

const u=document.getElementById('callsign').value.toUpperCase();
const m=document.getElementById('message').value;

network.set({
u,m,
t:new Date().toLocaleTimeString()
});

document.getElementById('message').value='';
};

network.map().once(data=>{
if(!data||!data.m)return;

const div=document.createElement('div');
div.className='intel-entry';
div.innerHTML=`
<div class="meta">[${data.u}] ${data.t}</div>
<div>> ${data.m}</div>
`;

display.prepend(div);
});

/* ========= DeepSeek AI ========= */

function saveKey(){
localStorage.setItem(
"deepseek_key",
document.getElementById("apiKey").value
);
alert("密钥已保存");
}

document.getElementById("apiKey").value=
localStorage.getItem("deepseek_key")||"";

async function askAI(){

const key=localStorage.getItem("deepseek_key");
if(!key){
alert("请输入 API Key");
return;
}

const prompt=document.getElementById("aiInput").value;
const out=document.getElementById("aiOutput");

out.textContent="AI 分析中...";

try{

const res=await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+key
},
body:JSON.stringify({
model:"deepseek-chat",
messages:[
{role:"user",content:prompt}
]
})
});

const data=await res.json();

out.textContent=
data.choices?.[0]?.message?.content
||"AI 无响应";

}catch(e){

out.textContent="请求失败："+e;

}

}

</script>

</body>
</html>
