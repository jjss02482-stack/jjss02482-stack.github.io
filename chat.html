<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>G.R.I.M. 内部终端</title>

<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:Courier New;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* ===== 锁屏 ===== */

#lock{
text-align:center;
}

#lock h1{
font-size:60px;
letter-spacing:5px;
}

input{
background:#000;
border:1px solid #fff;
color:#fff;
padding:10px;
font-size:18px;
}

button{
background:#000;
border:1px solid #fff;
color:#fff;
padding:10px 20px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#fff;
color:#000;
}

/* ===== 主终端 ===== */

#terminal{
display:none;
flex-direction:column;
width:90%;
height:90%;
position:relative;
}

header{
font-size:60px;
text-align:center;
margin:10px;
animation:breath 3s infinite;
}

@keyframes breath{
0%{opacity:.3}
50%{opacity:1}
100%{opacity:.3}
}

.panel{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

#screen{
flex:1;
border:1px solid #fff;
padding:10px;
overflow:auto;
white-space:pre-wrap;
}

/* ===== 像素地球 ===== */

#globe{
position:absolute;
bottom:10px;
left:10px;
font-size:40px;
animation:spin 6s linear infinite;
opacity:.8;
}

@keyframes spin{
from{transform:rotate(0)}
to{transform:rotate(360deg)}
}

textarea{
width:100%;
height:200px;
background:#000;
color:#fff;
border:1px solid #fff;
}

</style>
</head>

<body>

<!-- 锁屏 -->

<div id="lock">

<h1>需要解锁二级权限</h1>

<input id="pass" type="password" placeholder="输入密码">

<br>

<button onclick="unlock()">解锁</button>

<div id="msg"></div>

</div>

<!-- 主终端 -->

<div id="terminal">

<header>G.R.I.M.</header>

<div class="panel">
<button onclick="brief()">暗区简报</button>
<button onclick="showRanks()">军衔系统</button>
<button onclick="diary()">日记本</button>
<button onclick="location.href='index.html'">返回主页</button>
</div>

<div id="screen">内部终端已启动…</div>

<div id="globe">🌍</div>

</div>

<script>

const PASSWORD="J.0330jpn";

function unlock(){

if(document.getElementById("pass").value===PASSWORD){

document.getElementById("lock").style.display="none";
document.getElementById("terminal").style.display="flex";

}else{

document.getElementById("msg").textContent="❌ 无权限";

}

}

/* 数据 */

const screen=document.getElementById("screen");

const ranks=[
{name:"实习",desc:"习见阶段，你要通过完成任务转正"},
{name:"二等兵",desc:"完成初级训练，可以接取部分任务。"},
{name:"一等兵",desc:"拥有标准武器申领权，允许与军校教官一起行动。"},
{name:"上等兵",desc:"精英士兵，拥有每日标准装备领取权限，允许与准尉行动"},
{name:"军校教官",desc:"负责新兵评估，并且对其训练和任职上的管理。"},
{name:"准尉",desc:"战术顾问储备，在一定程度上帮助队伍的信息调整"},
{name:"下士",desc:"战术骨干，需要彻底熟图并且保持战术能力"},
{name:"中士",desc:"班组核心，获得4人小队权限"},
{name:"上士",desc:"资深战术专家，允许直接管理军校教官。"},
{name:"军士长",desc:"士兵领袖，负责管理军士长以下职位的所有职位。"},
{name:"中尉",desc:"排级指挥官，允许在未经过讨论下随意做出任务改变。"},
{name:"上尉",desc:"连级核心，允许使用投掷无人机等等实验装备"},
{name:"准将",desc:"统筹暗区战役，拥有地图选择权。"},
{name:"少将",desc:"允许在批准的情况下，间接与上将直接交谈。"},
{name:"中将",desc:"允许开始布置任务。"},
{name:"上将",desc:"决策层成员，决定所有职位，可以在批准下进行裁员"},
{name:"五星上将",desc:"最高权限拥有者。众人之上，强者之列。控制所有队员。"}
];

/* 功能 */

function brief(){

screen.textContent=
"【暗区简报】\n\n"+
"• 电视台已被白狼联队占领\n"+
"• 深渊小队近日伙食变好";

}

function showRanks(){

let out="【军衔系统】\n\n";

ranks.forEach((r,i)=>{

out+=(i+1)+"."+r.name+"\n"+r.desc+"\n\n";

});

screen.textContent=out;

}

function diary(){

screen.innerHTML=`
【日记本】

<textarea id="note"></textarea>
<br>
<button onclick="saveNote()">保存</button>
`;

document.getElementById("note").value=
localStorage.getItem("grim_note")||"";

}

function saveNote(){

localStorage.setItem(
"grim_note",
document.getElementById("note").value
);

alert("已保存");

}

</script>

</body>
</html>
