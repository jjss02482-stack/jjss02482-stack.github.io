<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NEW YORK 2015 - 实时生存终端</title>
    <style>
        :root { 
            --accent-blue: #0055ff; --bg-white: #ffffff; --panel-gray: #f4f4f4; 
            --text-dark: #1a1a1a; --police-blue: #0033aa; --wanted-red: #ff0000; 
            --ally-green: #008844; --stamina-orange: #ff9900; --vehicle-purple: #8800ff;
            --story-gold: #d4af37;
        }
        body { background-color: var(--bg-white); color: var(--text-dark); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        #game-container { background: var(--bg-white); border: 1px solid #ddd; width: 950px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); position: relative; }
        h1 { text-align: center; letter-spacing: 8px; border-bottom: 2px solid #000; padding-bottom: 15px; font-weight: 900; margin-bottom: 5px; }
        #clock-bar { text-align: center; font-family: 'Courier New', monospace; font-weight: bold; color: var(--wanted-red); margin-bottom: 15px; font-size: 14px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; background: var(--panel-gray); padding: 15px; border-radius: 4px; border: 1px solid #eee; }
        .stat-item { font-size: 11px; color: #666; text-transform: uppercase; }
        .stat-value { color: var(--accent-blue); font-weight: bold; font-family: 'Courier New', monospace; font-size: 13px; }
        
        #log { height: 280px; overflow-y: auto; border: 1px solid #eee; padding: 15px; background: #fafafa; margin-bottom: 20px; font-size: 13px; line-height: 1.8; border-left: 4px solid var(--accent-blue); }
        .story-msg { color: var(--story-gold); font-weight: bold; background: #000; padding: 2px 5px; }
        .warning-msg { color: var(--wanted-red); font-weight: bold; animation: blink 1s infinite; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { background: #fff; color: #000; border: 1px solid #000; padding: 14px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: #000; color: #fff; }
        
        #modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 10; padding: 20px; box-sizing: border-box; backdrop-filter: blur(10px); }
        #modal-content { border: 1px solid #000; background: #fff; height: 95%; padding: 30px; overflow-y: auto; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="game-container">
    <h1>NEW YORK 2015</h1>
    <div id="clock-bar">NEXT DAY IN: <span id="timer-sec">60</span>s | CURRENT DAY: <span id="display-day">1</span></div>

    <div id="setup-screen" style="text-align: center; padding: 40px 0;">
        <h3 style="letter-spacing: 3px;">INITIALIZING SURVIVAL PROTOCOL</h3>
        <button onclick="initGame('POLICE')" style="display:block; width:100%; margin:15px 0;">NYPD UNIT</button>
        <button onclick="initGame('MILITARY')" style="display:block; width:100%; margin:15px 0;">NATIONAL GUARD</button>
        <button onclick="initGame('GANG')" style="display:block; width:100%; margin:15px 0;">THE CLAN</button>
    </div>

    <div id="main-ui" style="display:none;">
        <div class="stats-grid">
            <div class="stat-item">ID/VITALS: <span id="stat-name" class="stat-value"></span> | <span id="stat-hp" class="stat-value">100</span>%</div>
            <div class="stat-item">STAMINA: <span id="stat-stam" style="color:var(--stamina-orange);">100</span>/100</div>
            <div class="stat-item">VEHICLE: <span id="stat-car" style="color:var(--vehicle-purple); font-weight:bold;">WALKING</span></div>
            <div class="stat-item">CREDITS: <span id="stat-money" class="stat-value"></span></div>
        </div>

        <div id="log"></div>

        <div class="menu-grid">
            <button onclick="openMove()">🗺️ SECTOR / 区域移动</button>
            <button onclick="openMissions()">📱 COMMS / 接收任务</button>
            <button onclick="executeMission()">⚡ ACTION / 执行任务</button>
            <button onclick="openMarket()">🛒 TRADE / 影子集市</button>
            <button onclick="openInventory()">🎒 GEAR / 战术背包</button>
            <button onclick="openStory()">📖 STORY / 剧情任务</button>
            <button onclick="passDay()">💤 REST / 休息一天</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
            <button onclick="closeModal()" style="width:100%; margin-top:20px; border-color: #f00; color: #f00;">CLOSE</button>
        </div>
    </div>
</div>

<script>
// --- 核心变量 ---
let player = { 
    name: "", faction: "", hp: 100, stamina: 100, money: 500, wanted: 0, 
    loc: "中城区", inv: [], mission: null, day: 1, car: null,
    storyProgress: { "DRUG": 1, "GOLD": 1, "SAMPLE": 1 } 
};

let secondsRemaining = 60;
const AREAS = { "中城区": 1, "华尔街": 2, "哈林区": 3, "布鲁克林": 2, "航母禁区": 5 };

// 剧情任务数据
const STORY_DATA = {
    "DRUG": [
        { ch: 1, title: "雷德尔：街头眼线", loc: "哈林区", reward: 2000, msg: "找到藏匿的毒贩。" },
        { ch: 2, title: "雷德尔：仓库突袭", loc: "布鲁克林", reward: 5000, msg: "缴获首批物资。" },
        { ch: 3, title: "雷德尔：腐败证据", loc: "华尔街", reward: 8000, msg: "拿到受贿名单。" },
        { ch: 4, title: "【终章】雷德尔：正义审判", loc: "航母禁区", reward: 20000, msg: "摧毁禁区母舰供货链！" }
    ],
    "GOLD": [
        { ch: 1, title: "影子议会：遗失密钥", loc: "中城区", reward: 3000, msg: "寻找银行经理。" },
        { ch: 2, title: "影子议会：金库外围", loc: "华尔街", reward: 6000, msg: "关闭金库警报。" },
        { ch: 3, title: "影子议会：重型运输", loc: "布鲁克林", reward: 9000, msg: "护送运输卡车。" },
        { ch: 4, title: "【终章】影子议会：撤离纽约", loc: "航母禁区", reward: 20000, msg: "将黄金送上禁区飞机！" }
    ],
    "SAMPLE": [
        { ch: 1, title: "代号救赎：血清采集", loc: "哈林区", reward: 4000, msg: "采集初版样本。" },
        { ch: 2, title: "代号救赎：实验室密钥", loc: "中城区", reward: 7000, msg: "寻找首席通行证。" },
        { ch: 3, title: "代号救赎：最后实验", loc: "布鲁克林", reward: 10000, msg: "合成疫苗原型。" },
        { ch: 4, title: "【终章】代号救赎：拯救世界", loc: "航母禁区", reward: 20000, msg: "在禁区母舰上传数据！" }
    ]
};

const VEHICLES = [
    { name: "卡车", price: 20000, resist: false, armored: false, stealth: false },
    { name: "轿车", price: 50000, resist: false, armored: false, stealth: false },
    { name: "警用防暴车", price: 70000, resist: true, armored: false, stealth: false },
    { name: "维多利亚皇冠", price: 90000, resist: false, armored: false, stealth: true },
    { name: "特种防弹车", price: 100000, resist: false, armored: true, stealth: false }
];

function initGame(f) {
    player.name = prompt("IDENTIFICATION:") || "GHOST"; player.faction = f;
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('main-ui').style.display = 'block';
    updateUI();
    startClock();
}

function startClock() {
    setInterval(() => {
        secondsRemaining--;
        if (secondsRemaining <= 0) {
            passDay();
        }
        document.getElementById('timer-sec').innerText = secondsRemaining;
    }, 1000);
}

function updateUI() {
    document.getElementById('stat-name').innerText = player.name;
    document.getElementById('stat-hp').innerText = player.hp;
    document.getElementById('stat-stam').innerText = player.stamina;
    document.getElementById('stat-money').innerText = `$${player.money}`;
    document.getElementById('stat-car').innerText = player.car ? player.car.name : "WALKING";
    document.getElementById('display-day').innerText = player.day;
    if(player.hp <= 0) { alert("你死在了这场阴谋中..."); location.reload(); }
}

function addLog(msg) {
    const l = document.getElementById('log');
    l.innerHTML += `<div>[D-${player.day}] ${msg}</div>`;
    l.scrollTop = l.scrollHeight;
}

// --- 每日流逝逻辑 ---
function passDay() { 
    player.day++; 
    secondsRemaining = 60; // 重置现实计时器
    player.stamina = 100;
    
    // 每日资源消耗
    player.hp -= 5; 
    addLog("<span style='color:#666'>🌅 新的一天开始。饥饿和疲劳让你失去了 5 HP。</span>");
    
    updateUI(); 
}

// --- 任务执行逻辑 (含失败后果) ---
function executeMission() {
    if(!player.mission) return addLog("⚠ 无活跃任务。");
    if(player.loc !== player.mission.loc) return addLog(`⚠ 请前往 ${player.mission.loc}`);
    if(player.stamina < 20) return addLog("⚠ 体力不足，无法行动。");

    addLog(`正在执行: ${player.mission.title}...`);
    player.stamina -= 20;

    setTimeout(() => {
        let success = Math.random() > 0.2; // 80% 成功率
        
        if(success) {
            player.money += player.mission.reward;
            addLog(`✅ 成功！获得回报 $${player.mission.reward}`);
            if(player.mission.storyKey) {
                addLog(`<span class="story-msg">剧情 [${player.mission.storyKey}] 进度提升！</span>`);
                player.storyProgress[player.mission.storyKey]++;
            }
        } else {
            // 失败后果
            player.hp -= 20;
            addLog(`<span class="warning-msg">💀 任务失败！遭到反击受伤 HP-20。</span>`);
            if(player.mission.storyKey === "DRUG") {
                player.wanted = Math.min(5, player.wanted + 1);
                addLog("<span class='warning-msg'>雷德尔任务泄密！你的通缉等级上升了。</span>");
            }
        }
        player.mission = null;
        updateUI();
    }, 1200);
}

// --- 移动、商店等逻辑 ---
function move(target) {
    let cost = player.car ? 0 : 50;
    if(player.stamina < cost) return addLog("⚠ 体力不足！");
    player.stamina -= cost;
    player.loc = target;
    addLog(`抵达 ${target}`);

    if(target === "航母禁区") {
        if(!(player.car && player.car.armored)) {
            player.hp -= 40;
            addLog(`<span class="warning-msg">💥 遭到禁区机炮扫射！受到 40 伤害。</span>`);
        } else {
            addLog("🛡️ 装甲完美抵御了禁区的火力。");
        }
    }
    closeModal(); updateUI();
}

function openStory() {
    let html = "<h3>STORY MISSIONS / 剧情任务</h3>";
    for(let key in STORY_DATA) {
        let currentIdx = player.storyProgress[key] - 1;
        if(currentIdx < 4) {
            let task = STORY_DATA[key][currentIdx];
            html += `<div style="padding:15px; border:2px solid #ddd; margin-bottom:10px;">
                <b>${task.title}</b><br>
                区域: ${task.loc} | 奖励: <span style="color:green">$${task.reward}</span><br>
                <button onclick="takeMission('${key}', ${currentIdx}, true)">接取剧情任务</button>
            </div>`;
        }
    }
    openModal("STORY", html);
}

function takeMission(key, idx, isStory) {
    let task = STORY_DATA[key][idx];
    player.mission = { ...task, storyKey: key };
    addLog(`确认目标: ${task.title}`);
    closeModal();
}

function openMove() {
    let html = "<h4>SECTOR</h4>";
    Object.keys(AREAS).forEach(l => {
        if(l !== player.loc) html += `<button onclick="move('${l}')" style="display:block; width:100%; margin:10px 0;">前往 ${l}</button>`;
    });
    openModal("NAV", html);
}

function openMarket() {
    let html = "<h4>载具交易</h4>";
    VEHICLES.forEach(v => {
        html += `<div>${v.name} ($${v.price}) <button onclick="buyCar(${VEHICLES.indexOf(v)})">购买</button></div>`;
    });
    html += "<h4>物资</h4>";
    [["医疗包(+40HP)", 200], ["能量棒(+20STAM)", 100]].forEach(n => {
        html += `<div>${n[0]} ($${n[1]}) <button onclick="buyItem('${n[0]}', ${n[1]})">买</button></div>`;
    });
    openModal("MARKET", html);
}

function buyCar(i) {
    if(player.money >= VEHICLES[i].price) {
        player.money -= VEHICLES[i].price; player.car = VEHICLES[i];
        addLog(`获得载具: ${player.car.name}`); closeModal(); updateUI();
    }
}

function buyItem(n, p) { 
    if(player.money >= p) { 
        player.money -= p; 
        if(n.includes("医疗包")) player.hp = Math.min(100, player.hp + 40);
        else player.stamina = Math.min(100, player.stamina + 20);
        updateUI(); addLog(`使用了 ${n}`);
    } 
}

function openInventory() { openModal("GEAR", player.car ? `当前载具: ${player.car.name}` : "步兵状态"); }
function openMissions() { addLog("普通任务暂无，请推进剧情。"); }
function openModal(t, b) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = b; document.getElementById('modal-overlay').style.display = 'block'; }
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
</script>
</body>
</html>
