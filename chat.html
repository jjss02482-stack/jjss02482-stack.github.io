<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>G.R.I.M. 内部终端</title>

<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:Courier New;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* ===== 锁屏 ===== */

#lock{
text-align:center;
z-index:2;
}

#lock h1{
font-size:60px;
letter-spacing:5px;
}

.pass-wrap{
display:flex;
justify-content:center;
gap:6px;
}

input{
background:#000;
border:1px solid #fff;
color:#fff;
padding:10px;
font-size:18px;
}

.eye{
cursor:pointer;
padding:10px;
border:1px solid #fff;
user-select:none;
}

button{
background:#000;
border:1px solid #fff;
color:#fff;
padding:10px 20px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#fff;
color:#000;
}

/* ===== 主终端 ===== */

#terminal{
display:none;
flex-direction:column;
width:90%;
height:90%;
position:relative;
z-index:1;
}

header{
font-size:60px;
text-align:center;
margin:10px;
animation:breath 3s infinite;
}

@keyframes breath{
0%{opacity:.3}
50%{opacity:1}
100%{opacity:.3}
}

.panel{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

#screen{
flex:1;
border:1px solid #fff;
padding:10px;
overflow:auto;
white-space:pre-wrap;
background:rgba(0,0,0,.85);
}

textarea{
width:100%;
height:200px;
background:#000;
color:#fff;
border:1px solid #fff;
}

/* ===== 背景雷达地球 ===== */

#globeCanvas{
position:absolute;
bottom:10px;
