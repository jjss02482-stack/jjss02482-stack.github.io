<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>G.R.I.M. 战术终端 | 全球链路</title>
    <style>
        body { background: #fff; color: #000; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #warning { background: #ff0; color: #000; padding: 10px; text-align: center; font-weight: bold; font-size: 13px; }
        .nav { background: #000; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        #chat-flow { flex-grow: 1; padding: 20px; overflow-y: auto; line-height: 1.6; }
        .msg { margin-bottom: 10px; border-left: 2px solid #eee; padding-left: 10px; }
        .msg.me { border-left-color: #000; font-weight: bold; }
        .input-area { border-top: 2px solid #000; padding: 20px; display: flex; }
        input { border: none; outline: none; flex-grow: 1; font-family: inherit; font-size: 16px; }
        .back-link { color: #fff; text-decoration: none; border: 1px solid #fff; padding: 2px 8px; font-size: 12px; }
    </style>
</head>
<body>

<div id="warning">⚠️ 警报：战术链路延迟波动较大 (预估 2000ms - 5000ms) ⚠️</div>

<nav class="nav">
    <span>G.R.I.M. TERMINAL v4.0</span>
    <a href="index.html" class="back-link">返回 0330 档案</a>
</nav>

<div id="chat-flow">
    <div style="color:#888;">> 正在通过公共卫星频率建立连接...</div>
</div>

<div class="input-area">
    <span style="font-weight:bold; margin-right:10px;">CMD:></span>
    <input type="text" id="msg-input" placeholder="发送战术简报..." autofocus autocomplete="off">
</div>

<script>
    const chatFlow = document.getElementById('chat-flow');
    const msgInput = document.getElementById('msg-input');
    const myID = "UNIT_" + Math.floor(Math.random()*999);

    // 这里使用一个公共的、免密钥的测试 API
    // 注意：这个 URL 仅用于展示逻辑，真实环境下我们会指向一个公共的数据池
    const PUBLIC_FEED = 'https://api.jsonbin.io/v3/b/65cexxxxxx'; 

    // 模拟接收：每 3 秒自动扫描一次“频率”
    function syncMessages() {
        // 实际上这里会去 fetch(PUBLIC_FEED)
        // 但为了让你立刻能用，我们继续保持标签页互通逻辑，并加入“人工延迟”
        console.log("正在同步全球数据...");
    }

    setInterval(syncMessages, 3000);

    msgInput.onkeydown = function(e) {
        if (e.key === 'Enter' && msgInput.value.trim()) {
            const text = msgInput.value;
            // 立即在本地显示
            displayMsg(myID, text, true);
            
            // 模拟发送到全球
            localStorage.setItem('grim_sync', JSON.stringify({sender: myID, text: text, time: Date.now()}));
            msgInput.value = '';
        }
    };

    // 监听全球（其实是本地模拟）同步信号
    window.addEventListener('storage', (e) => {
        if (e.key === 'grim_sync') {
            const data = JSON.parse(e.newValue);
            // 加入随机战术延迟，模拟跨国传输
            setTimeout(() => {
                displayMsg(data.sender, data.text, false);
            }, 1200); 
        }
    });

    function displayMsg(user, text, isMe) {
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : ''}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${user}: ${text}`;
        chatFlow.appendChild(div);
        chatFlow.scrollTop = chatFlow.scrollHeight;
    }
</script>
</body>
</html>
