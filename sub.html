<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>纽约霸主：生存与杀戮 - 终极版</title>
    <style>
        :root { --neon-green: #00ff00; --dark-bg: #0a0a0a; --wanted-red: #ff0000; --police-blue: #0088ff; }
        body { background-color: var(--dark-bg); color: #ccc; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; padding: 20px; margin: 0; }
        #game-container { background: #000; border: 2px solid #333; width: 900px; padding: 25px; box-shadow: 0 0 30px rgba(0,255,0,0.1); position: relative; }
        h1 { text-align: center; color: var(--neon-green); text-transform: uppercase; letter-spacing: 5px; border-bottom: 2px solid #222; padding-bottom: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; background: #111; padding: 15px; border-radius: 5px; }
        .stat-item { font-size: 14px; }
        .stat-value { color: var(--neon-green); font-weight: bold; }
        
        #log { height: 280px; overflow-y: auto; border: 1px solid #222; padding: 15px; background: #050505; margin-bottom: 20px; font-size: 13px; line-height: 1.6; border-left: 3px solid var(--neon-green); }
        .police-msg { color: var(--police-blue); font-weight: bold; }

        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { background: #1a1a1a; color: var(--neon-green); border: 1px solid var(--neon-green); padding: 12px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; text-transform: uppercase; font-size: 11px; }
        button:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-green); }
        
        #modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10; padding: 20px; box-sizing: border-box; }
        #modal-content { border: 1px solid var(--neon-green); background: #000; height: 90%; padding: 20px; overflow-y: auto; text-align: center; }
        
        .dial-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 210px; margin: 20px auto; }
        .dial-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 20px; border: 1px solid var(--neon-green); }
        #dial-display { font-size: 24px; color: var(--neon-green); margin-bottom: 20px; height: 30px; letter-spacing: 5px; border-bottom: 1px solid #333; }
        .faction-card { border: 1px solid #444; padding: 15px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🌆 New York Overlord: Z</h1>

    <div id="setup-screen">
        <h3 style="text-align:center;">选择你的出身背景</h3>
        <div class="faction-card" onclick="initGame('POLICE')"><b>👮 NYPD 秩序守护者 (法律加成)</b></div>
        <div class="faction-card" onclick="initGame('MILITARY')"><b>🎖️ 国民警卫队 (重火力)</b></div>
        <div class="faction-card" onclick="initGame('GANG')"><b>💀 “骷髅会”帮派 (黑市折扣)</b></div>
    </div>

    <div id="main-ui" style="display:none;">
        <div class="stats-grid">
            <div class="stat-item">代号: <span id="stat-name" class="stat-value"></span></div>
            <div class="stat-item">阵营: <span id="stat-faction" class="stat-value"></span></div>
            <div class="stat-item">通缉: <span id="stat-wanted" style="color:red;"></span></div>
            <div class="stat-item">钱包: <span id="stat-money" class="stat-value"></span></div>
            <div class="stat-item">HP: <span id="stat-hp" class="stat-value"></span>%</div>
            <div class="stat-item">饱食: <span id="stat-food" class="stat-value"></span></div>
            <div class="stat-item">位置: <span id="stat-loc" class="stat-value"></span></div>
            <div class="stat-item">队友: <span id="stat-partner" style="color:var(--police-blue);">无</span></div>
        </div>

        <div id="log"></div>

        <div class="menu-grid">
            <button onclick="openMove()">🗺️ 移动</button>
            <button onclick="openMissions()">📱 任务</button>
            <button onclick="executeMission()">⚡ 执行任务</button>
            <button onclick="openMarket()">🛒 黑市</button>
            <button onclick="openInventory()">🎒 背包</button>
            <button onclick="openPhone()">📞 拨号</button>
            <button onclick="passDay()">💤 休息</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
            <button onclick="closeModal()" style="width:100%; margin-top:20px; border-color: #f00; color: #f00;">返回</button>
        </div>
    </div>
</div>

<script>
let player = { 
    name: "", faction: "", hp: 100, food: 100, water: 100, 
    money: 200, wanted: 0, loc: "中城区", inv: [], 
    mission: null, day: 1, partnerTurns: 0 
};
let dialNum = "";

const SECRETS = {
    "911": { 
        call: () => {
            if (Math.random() < 0.8) {
                player.partnerTurns = 2;
                addLog(`<span class="police-msg">【911响应】一名幸存的警员接手了请求：“伙计，我正好在附近，我能陪你干两趟活。”</span>`);
            } else {
                addLog(`...电话那头只有嘈杂的求救声和枪响，没人理会你。`);
            }
        }
    },
    "666": { call: () => { addLog("👹 恶魔之声：‘用你的灵魂换取金钱...’"); player.hp -= 20; player.money += 400; }},
    "1999": { call: () => { addLog("📻 听到旧时代的广播：‘今日道指上涨...’。你在脚下发现$200。"); player.money += 200; }}
};

function initGame(f) {
    player.name = prompt("输入代号:", "Ghost");
    player.faction = f;
    if(f==='GANG') player.money=800;
    if(f==='MILITARY') player.inv.push("M4步枪");
    document.getElementById('setup-screen').style.display='none';
    document.getElementById('main-ui').style.display='block';
    addLog(`系统：曼哈顿生存协议已启动。`);
    updateUI();
}

function updateUI() {
    document.getElementById('stat-name').innerText = player.name;
    document.getElementById('stat-faction').innerText = player.faction;
    document.getElementById('stat-wanted').innerText = "★".repeat(player.wanted);
    document.getElementById('stat-hp').innerText = player.hp;
    document.getElementById('stat-money').innerText = "$" + player.money;
    document.getElementById('stat-food').innerText = player.food;
    document.getElementById('stat-loc').innerText = player.loc;
    document.getElementById('stat-partner').innerText = player.partnerTurns > 0 ? `警员协同 (${player.partnerTurns}次)` : "无";
    if(player.hp <= 0) { alert("你死在了废墟中..."); location.reload(); }
}

function addLog(m) {
    const l = document.getElementById('log');
    l.innerHTML += `<div>[Day ${player.day}] ${m}</div>`;
    l.scrollTop = l.scrollHeight;
}

// --- 拨号系统 ---
function openPhone() {
    dialNum = "";
    let html = `<div id="dial-display">_</div><div class="dial-pad">` + 
        [1,2,3,4,5,6,7,8,9,"*",0,"#"].map(n => `<button class="dial-btn" onclick="pressDial('${n}')">${n}</button>`).join("") +
        `</div><button onclick="call()" style="width:210px; background:#008800; color:white; border:none; padding:10px;">拨通</button>`;
    openModal("加密通讯终端", html);
}

function pressDial(n) { dialNum += n; document.getElementById('dial-display').innerText = dialNum; }

function call() {
    addLog(`📞 拨号中: ${dialNum}...`);
    if(SECRETS[dialNum]) SECRETS[dialNum].call();
    else addLog("...线路忙，请稍后再拨。");
    closeModal(); updateUI();
}

// --- 任务系统 (核心修改点) ---
function executeMission() {
    if(!player.mission) return addLog("⚠ 你没有待执行的任务。");
    if(player.loc !== player.mission.loc) return addLog(`📍 任务目标在 ${player.mission.loc}！`);

    addLog(`执行任务: ${player.mission.title}...`);
    
    // 成功率逻辑
    let successChance = 0.6;
    if (player.inv.includes("M4步枪")) successChance += 0.2;
    if (player.partnerTurns > 0) {
        successChance += 0.25; // 警察在场大幅提升概率
        addLog(`<span class="police-msg">警员为你提供掩护，任务成功率提升！</span>`);
    }

    setTimeout(() => {
        if(Math.random() < successChance) {
            addLog(`✅ 任务大成功！赚取 $${player.mission.reward}`);
            player.money += player.mission.reward;
            if(player.partnerTurns > 0) player.partnerTurns--; 
            player.mission = null;
        } else {
            addLog(`💀 任务失败，你受伤了！`);
            player.hp -= 30;
            if(player.partnerTurns > 0) {
                addLog(`<span class="police-msg">警员为了掩护你撤退，先行离开了。</span>`);
                player.partnerTurns = 0;
            }
        }
        updateUI();
    }, 1000);
}

// --- 基础导航 ---
function openModal(t, b) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = b; document.getElementById('modal-overlay').style.display = 'block'; }
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
function openMove() {
    let locs = ["中城区", "华尔街", "哈林区", "航母禁区"];
    openModal("移动至...", locs.map(l => `<button onclick="player.loc='${l}'; addLog('抵达${l}'); closeModal(); updateUI();" style="display:block; width:100%; margin:5px 0;">${l}</button>`).join(""));
}
function openMissions() {
    player.mission = { title: "搜寻医疗包", loc: "哈林区", reward: 500 };
    addLog(`📡 新任务: 在 ${player.mission.loc} ${player.mission.title}`);
}
function passDay() { player.day++; player.food -= 10; addLog("🌅 新的一天，警察和威胁同在。"); updateUI(); }
function openMarket() { openModal("影子集市", "<button onclick='if(player.money>=1000){player.money-=1000; player.inv.push(\"M4步枪\"); updateUI(); closeModal();}'>$1000 购买 M4步枪</button>"); }
function openInventory() { openModal("战术背包", player.inv.length ? player.inv.join(", ") : "空"); }
</script>
</body>
</html>
