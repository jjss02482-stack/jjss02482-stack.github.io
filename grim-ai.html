<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>G.R.I.M. AI 战术终端</title>

<style>
:root{
--red:#ff0000;
--bg:#000;
--panel:#0a0a0a;
}

body{
margin:0;
background:var(--bg);
color:#fff;
font-family:Courier New;
display:flex;
flex-direction:column;
height:100vh;
}

header{
padding:15px;
background:var(--panel);
border-bottom:2px solid #111;
color:var(--red);
letter-spacing:2px;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
margin:8px 0;
white-space:pre-wrap;
}

.user{color:#fff;}
.ai{color:#00ff66;}

.panel{
display:flex;
gap:8px;
padding:12px;
background:var(--panel);
border-top:2px solid #111;
}

input{
flex:1;
background:#000;
border:1px solid #333;
color:#fff;
padding:8px;
}

button{
background:var(--red);
border:none;
color:#fff;
padding:8px 14px;
cursor:pointer;
}

button:hover{
background:#cc0000;
}
</style>
</head>

<body>

<header>
G.R.I.M. — DeepSeek 战术终端
</header>

<div id="chat"></div>

<div class="panel">
<input id="apiKey" placeholder="输入 DeepSeek API Key">
<button onclick="saveKey()">保存</button>
</div>

<div class="panel">
<input id="input" placeholder="输入战术请求...">
<button onclick="send()">发送</button>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const keyBox = document.getElementById("apiKey");

keyBox.value = localStorage.getItem("grim_key") || "";

function saveKey(){
localStorage.setItem("grim_key", keyBox.value);
alert("密钥已保存");
}

function addMsg(text, cls){
const div = document.createElement("div");
div.className = "msg " + cls;
div.textContent = text;
chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}

async function send(){

const key = localStorage.getItem("grim_key");
if(!key){
alert("请先输入 API Key");
return;
}

const prompt = input.value.trim();
if(!prompt) return;

addMsg("> "+prompt, "user");
input.value = "";

addMsg("AI 思考中...", "ai");

try{

const res = await fetch(
"https://api.deepseek.com/chat/completions",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+key
},
body:JSON.stringify({
model:"deepseek-chat",
messages:[
{
role:"system",
content:"你是 G.R.I.M. 战术 AI，用冷静、简洁、军事风格回答。"
},
{
role:"user",
content:prompt
}
]
})
});

const data = await res.json();

chat.lastChild.remove();

const reply =
data.choices?.[0]?.message?.content
|| "AI 无响应";

addMsg(reply, "ai");

}catch(e){

chat.lastChild.remove();
addMsg("通信失败："+e, "ai");

}

}

input.addEventListener("keydown", e=>{
if(e.key==="Enter") send();
});

</script>

</body>
</html>
